[project]
name = "orchestra"
version = "0.1.1"
description = "orchestra v2 — provider-agnostic multi-project agent workflow"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0"]

[project.scripts]
orchestra = "orchestra.cli:main"

[dependency-groups]
dev = ["mypy>=1.15", "pytest>=8.0", "ruff>=0.11", "pytest-timeout>=2.3"]

[tool.ruff.lint]
# ARG002 (unused method argument) is dropped, ARG001 (unused function argument) kept. Ruling of 2026-09-08 during the refactor trial: a method implementing a shared interface has to take that interface's arguments.
select = ["E4", "E7", "E9", "F", "B", "SIM", "ARG001", "ERA", "T20", "PD"]

[tool.pytest.ini_options]
timeout = 5
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orchestra"]

[tool.hatch.build.targets.wheel.force-include]
"prompts" = "orchestra/defaults/prompts"
